
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Admin | Aryan Singh</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a11;color:#eef4ff;font:15px/1.5 Arial,sans-serif}
.wrap{width:min(1000px,94%);margin:30px auto}.panel{background:#0b1220;border:1px solid #263954;border-radius:14px;padding:20px;margin-bottom:16px}
h1{margin:5px 0}p,.muted{color:#9aabc3}.hidden{display:none!important}
input,textarea,select{width:100%;padding:11px;margin:5px 0 12px;background:#080f1b;color:white;border:1px solid #2a3c56;border-radius:8px}
label{display:block;color:#c4d0e0;font-size:13px}.btn{padding:10px 14px;border:1px solid #355174;border-radius:8px;background:#101e32;color:white;cursor:pointer;font-weight:bold;margin:3px}.primary{background:#3475ed;border:0}.danger{color:#ffb9c0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.item{padding:12px;border:1px solid #263954;border-radius:9px;margin:10px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.status{color:#90e3bd;overflow-wrap:anywhere}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <p>PRIVATE WORKSPACE</p>
  <h1>Portfolio Admin</h1>
  <p>Manage your editing portfolio.</p>
  <a href="index.html" style="color:#b5d7ff">← View website</a>
</header>

<section class="panel" id="loginPanel">
  <h2>Admin login</h2>
  <p>Sign in with your authorized Supabase user.</p>
  <form id="loginForm">
    <label>Email<input id="email" type="email" required autocomplete="username"></label>
    <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p id="loginStatus" class="status"></p>
</section>

<div id="app" class="hidden">
  <section class="panel">
    <span id="who" class="muted"></span>
    <button class="btn" id="logout" style="float:right">Log out</button>
    <div style="clear:both"></div>
  </section>

  <nav class="tabs">
    <button class="btn primary" data-tab="projects">Projects</button>
    <button class="btn" data-tab="showreel">Showreel</button>
  </nav>

  <section class="panel" id="projects">
    <h2>Add or edit project</h2>
    <form id="projectForm" class="grid">
      <input type="hidden" id="projectId">
      <label>Project title<input id="title" required></label>
      <label>Category
        <select id="category">
          <option>YouTube Videos</option><option>Shorts / Reels</option>
          <option>Gaming</option><option>Entertainment</option>
          <option>Documentary</option><option>Other</option>
        </select>
      </label>
      <label class="full">Thumbnail image URL<input id="thumbnail" type="url" placeholder="https://..."></label>
      <label>Video URL<input id="videoUrl" type="url" placeholder="https://..."></label>
      <label>Project / YouTube link<input id="projectUrl" type="url" placeholder="https://..."></label>
      <label class="full">Description<textarea id="description"></textarea></label>
      <div class="full">
        <button class="btn primary" type="submit">Save project</button>
        <button class="btn" id="clearForm" type="button">Clear form</button>
      </div>
    </form>
    <p id="projectStatus" class="status"></p>
    <h3>Saved projects</h3>
    <div id="projectList">Loading projects...</div>
  </section>

  <section class="panel hidden" id="showreel">
    <h2>Featured showreel</h2>
    <form id="reelForm">
      <label>Showreel URL<input id="reelUrl" type="url" placeholder="https://..."></label>
      <button class="btn primary" type="submit">Save showreel</button>
    </form>
    <p id="reelStatus" class="status"></p>
  </section>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://btveynbxiuvsdcxqrthh.supabase.co";
const SUPABASE_KEY = "sb_publishable_LXhuxKmiZPoMlFrfOk4GVg_JGj3ElDk";
const ADMIN_EMAIL = "bishtaryan333@gmail.com";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const el = id => document.getElementById(id);
function message(id, text) { el(id).textContent = text; }

function showApp(user) {
  const allowed = user && user.email &&
    user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
  el("loginPanel").classList.toggle("hidden", !!allowed);
  el("app").classList.toggle("hidden", !allowed);
  if (!allowed) {
    if (user) message("loginStatus", "This account is not authorized as the portfolio admin.");
    return;
  }
  el("who").textContent = "Signed in: " + user.email;
  loadProjects();
  loadShowreel();
}

async function checkSession() {
  const {data, error} = await db.auth.getSession();
  if (error) message("loginStatus", error.message);
  showApp(data?.session?.user || null);
}

el("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  message("loginStatus", "Signing in...");
  const {data, error} = await db.auth.signInWithPassword({
    email: el("email").value.trim(),
    password: el("password").value
  });
  if (error) {
    message("loginStatus", error.message);
    return;
  }
  if (data.user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    await db.auth.signOut();
    message("loginStatus", "This email is not the authorized admin account.");
    return;
  }
  message("loginStatus", "");
  showApp(data.user);
});

el("logout").addEventListener("click", async () => {
  await db.auth.signOut();
  showApp(null);
  message("loginStatus", "You have signed out.");
});

db.auth.onAuthStateChange((_event, session) => {
  showApp(session?.user || null);
});

document.querySelectorAll("[data-tab]").forEach(button => {
  button.addEventListener("click", () => {
    const target = button.dataset.tab;
    ["projects","showreel"].forEach(id =>
      el(id).classList.toggle("hidden", id !== target)
    );
    document.querySelectorAll("[data-tab]").forEach(b =>
      b.classList.toggle("primary", b === button)
    );
  });
});

function clearProjectForm() {
  el("projectForm").reset();
  el("projectId").value = "";
}
el("clearForm").addEventListener("click", clearProjectForm);

el("projectForm").addEventListener("submit", async e => {
  e.preventDefault();
  message("projectStatus", "Saving project...");
  const id = el("projectId").value;
  const project = {
    title: el("title").value.trim(),
    category: el("category").value,
    thumbnail: el("thumbnail").value.trim(),
    video_url: el("videoUrl").value.trim(),
    project_url: el("projectUrl").value.trim(),
    description: el("description").value.trim()
  };
  let result;
  if (id) {
    result = await db.from("projects").update(project).eq("id", id);
  } else {
    result = await db.from("projects").insert(project);
  }
  if (result.error) {
    message("projectStatus", "Save failed: " + result.error.message);
    return;
  }
  message("projectStatus", "Project saved to Supabase.");
  clearProjectForm();
  await loadProjects();
});

async function loadProjects() {
  const {data, error} = await db.from("projects")
    .select("*").order("created_at", {ascending:false});
  if (error) {
    el("projectList").textContent = "Could not load projects: " + error.message;
    return;
  }
  const list = el("projectList");
  list.replaceChildren();
  if (!data.length) {
    list.textContent = "No projects yet. Add your first project above.";
    return;
  }
  data.forEach(project => {
    const item = document.createElement("div");
    item.className = "item";
    const info = document.createElement("div");
    const title = document.createElement("strong");
    title.textContent = project.title;
    const category = document.createElement("div");
    category.className = "muted";
    category.textContent = project.category || "";
    info.append(title, category);

    const actions = document.createElement("div");
    const edit = document.createElement("button");
    edit.className = "btn";
    edit.textContent = "Edit";
    edit.onclick = () => {
      el("projectId").value = project.id;
      el("title").value = project.title || "";
      el("category").value = project.category || "Other";
      el("thumbnail").value = project.thumbnail || "";
      el("videoUrl").value = project.video_url || "";
      el("projectUrl").value = project.project_url || "";
      el("description").value = project.description || "";
      el("projectForm").scrollIntoView({behavior:"smooth"});
    };

    const del = document.createElement("button");
    del.className = "btn danger";
    del.textContent = "Delete";
    del.onclick = async () => {
      if (!confirm("Delete this project?")) return;
      const {error} = await db.from("projects").delete().eq("id", project.id);
      if (error) message("projectStatus", "Delete failed: " + error.message);
      else {
        message("projectStatus", "Project deleted.");
        loadProjects();
      }
    };
    actions.append(edit, del);
    item.append(info, actions);
    list.append(item);
  });
}

async function loadShowreel() {
  const {data, error} = await db.from("site_settings")
    .select("setting_value").eq("setting_key", "showreel_url").maybeSingle();
  if (error) {
    message("reelStatus", "Could not load showreel: " + error.message);
    return;
  }
  el("reelUrl").value = data?.setting_value?.url || "";
}

el("reelForm").addEventListener("submit", async e => {
  e.preventDefault();
  message("reelStatus", "Saving showreel...");
  const {error} = await db.from("site_settings").upsert({
    setting_key: "showreel_url",
    setting_value: {url: el("reelUrl").value.trim()},
    updated_at: new Date().toISOString()
  }, {onConflict:"setting_key"});
  message("reelStatus", error
    ? "Save failed: " + error.message
    : "Showreel saved to Supabase.");
});

checkSession();
</script>
</body>
</html>
