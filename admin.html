
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aryan Recut — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      font-family: Arial, sans-serif;
      color: #f3f5ff; background: #080d19;
    }
    main { max-width: 950px; margin: auto; }
    .panel {
      background: #111a2b; border: 1px solid #293752;
      border-radius: 14px; padding: 22px; margin: 18px 0;
    }
    h1 { font-size: 30px; }
    .muted { color: #a7b5ce; line-height: 1.5; }
    label { display: block; margin: 14px 0; color: #d5def0; }
    input, textarea, select {
      width: 100%; padding: 12px; margin-top: 7px;
      border: 1px solid #34445f; border-radius: 8px;
      background: #0a1221; color: white;
    }
    input[type=checkbox] { width: auto; }
    button {
      padding: 11px 15px; margin: 4px;
      border: 0; border-radius: 8px; cursor: pointer;
      color: white; background: #647fff; font-weight: bold;
    }
    .secondary { background: #34445f; }
    .danger { background: #9a3045; }
    .hidden { display: none !important; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .project {
      border: 1px solid #293752; background: #0a1221;
      padding: 15px; border-radius: 10px; margin: 12px 0;
    }
    .status { white-space: pre-wrap; overflow-wrap: anywhere; }
    @media(max-width:600px) {
      body { padding: 12px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <section id="loginScreen" class="panel">
    <h1>Aryan Recut</h1>
    <p class="muted">Admin login — sign in with your existing Supabase account.</p>
    <form id="loginForm">
      <label>Email
        <input id="email" type="email" autocomplete="username" required>
      </label>
      <label>Password
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="loginButton" type="submit">Sign In</button>
    </form>
    <p id="loginStatus" class="status"></p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="panel">
      <h1>Admin Dashboard</h1>
      <p class="muted">Add, edit and manage portfolio projects.</p>
      <button id="logoutButton" class="secondary" type="button">Log Out</button>
    </div>

    <section class="panel">
      <h2 id="formHeading">Add Project</h2>
      <form id="projectForm">
        <label>Project title *
          <input id="title" maxlength="180" required>
        </label>

        <div class="grid">
          <label>Category
            <select id="category">
              <option>Shorts</option>
              <option>Gaming</option>
              <option>Reels</option>
              <option>Documentary</option>
              <option>Other</option>
            </select>
          </label>
          <label>Thumbnail URL
            <input id="thumbnail" type="url" placeholder="https://...">
          </label>
        </div>

        <label>Video URL
          <input id="videoUrl" type="url" placeholder="https://...">
        </label>
        <label>Project URL
          <input id="projectUrl" type="url" placeholder="https://...">
        </label>
        <label>Description
          <textarea id="description" rows="4" maxlength="3000"></textarea>
        </label>
        <label>
          <input id="visible" type="checkbox" checked>
          Visible on public portfolio
        </label>

        <button id="saveButton" type="submit">Save Project</button>
        <button id="cancelButton" class="secondary hidden" type="button">Cancel Edit</button>
      </form>
      <p id="formStatus" class="status"></p>
    </section>

    <section class="panel">
      <h2>Saved Projects</h2>
      <button id="refreshButton" class="secondary" type="button">Refresh</button>
      <div id="projectList"></div>
      <p id="listStatus" class="status"></p>
    </section>
  </section>
</main>

<script>
  // Replace this with your real Supabase Project URL.
  const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";

  // Use the publishable key only. Never use an sb_secret_ key here.
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_wFItCw-_qhiDEVFo93RBBQ_2uwwNrb7";

  // This must be the UID of your authorised Supabase user.
  const OWNER_UID = "c9ddb0f1-c832-4ace-a0fc-528be1490bbb";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const $ = id => document.getElementById(id);
  let editingId = null;
  let busy = false;

  function message(id, text) {
    $(id).textContent = text;
  }

  function showLogin(text = "") {
    $("loginScreen").classList.remove("hidden");
    $("dashboard").classList.add("hidden");
    message("loginStatus", text);
  }

  function showDashboard() {
    $("loginScreen").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
  }

  async function checkOwner() {
    const { data, error } = await db.auth.getSession();
    const user = data?.session?.user;

    if (error || !user) {
      showLogin();
      return false;
    }

    if (user.id !== OWNER_UID) {
      await db.auth.signOut();
      showLogin("Access denied. This is not the owner account.");
      return false;
    }

    showDashboard();
    return true;
  }

  $("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy) return;
    busy = true;
    $("loginButton").disabled = true;
    message("loginStatus", "Signing in...");

    try {
      const { data, error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });

      if (error) throw error;

      if (data.user.id !== OWNER_UID) {
        await db.auth.signOut();
        throw new Error("This account is not authorised.");
      }

      $("password").value = "";
      showDashboard();
      await loadProjects();
    } catch (error) {
      message("loginStatus", "Login failed: " + error.message);
    } finally {
      busy = false;
      $("loginButton").disabled = false;
    }
  });

  $("logoutButton").addEventListener("click", async () => {
    const { error } = await db.auth.signOut();
    if (error) {
      message("listStatus", error.message);
      return;
    }
    resetForm();
    $("projectList").replaceChildren();
    showLogin("You are logged out.");
  });

  function resetForm() {
    editingId = null;
    $("projectForm").reset();
    $("visible").checked = true;
    $("formHeading").textContent = "Add Project";
    $("saveButton").textContent = "Save Project";
    $("cancelButton").classList.add("hidden");
  }

  $("cancelButton").addEventListener("click", resetForm);

  $("projectForm").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy || !(await checkOwner())) return;

    busy = true;
    $("saveButton").disabled = true;
    message("formStatus", "Saving...");

    const record = {
      title: $("title").value.trim(),
      category: $("category").value,
      thumbnail_url: $("thumbnail").value.trim() || null,
      video_url: $("videoUrl").value.trim() || null,
      project_url: $("projectUrl").value.trim() || null,
      description: $("description").value.trim() || null,
      is_visible: $("visible").checked
    };

    try {
      let result;

      if (editingId !== null) {
        result = await db.from("projects")
          .update(record).eq("id", editingId).select();
      } else {
        result = await db.from("projects")
          .insert(record).select();
      }

      if (result.error) throw result.error;

      if (!result.data || result.data.length === 0) {
        throw new Error("No row saved. Check your RLS policies and table columns.");
      }

      resetForm();
      message("formStatus", "Project saved successfully!");
      await loadProjects();
    } catch (error) {
      message("formStatus", "Save failed: " + error.message);
    } finally {
      busy = false;
      $("saveButton").disabled = false;
    }
  });

  function addText(parent, tag, text, className = "") {
    const element = document.createElement(tag);
    element.textContent = text || "";
    if (className) element.className = className;
    parent.appendChild(element);
    return element;
  }

  function editProject(project) {
    editingId = project.id;
    $("title").value = project.title || "";
    $("category").value = project.category || "Other";
    $("thumbnail").value = project.thumbnail_url || "";
    $("videoUrl").value = project.video_url || "";
    $("projectUrl").value = project.project_url || "";
    $("description").value = project.description || "";
    $("visible").checked = project.is_visible === true;

    $("formHeading").textContent = "Edit Project";
    $("saveButton").textContent = "Update Project";
    $("cancelButton").classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function deleteProject(project) {
    if (!(await checkOwner())) return;
    if (!confirm('Delete "' + project.title + '" permanently?')) return;

    message("listStatus", "Deleting...");

    const { data, error } = await db.from("projects")
      .delete().eq("id", project.id).select("id");

    if (error) {
      message("listStatus", "Delete failed: " + error.message);
      return;
    }

    if (!data || data.length === 0) {
      message("listStatus", "Nothing deleted. Check RLS policies.");
      return;
    }

    if (editingId === project.id) resetForm();
    message("listStatus", "Project deleted.");
    await loadProjects();
  }

  async function loadProjects() {
    if (!(await checkOwner())) return;
    message("listStatus", "Loading projects...");

    const { data, error } = await db.from("projects")
      .select("id,title,category,thumbnail_url,video_url,project_url,description,is_visible,created_at")
      .order("created_at", { ascending: false });

    if (error) {
      message("listStatus", "Load failed: " + error.message);
      return;
    }

    const list = $("projectList");
    list.replaceChildren();

    if (!data || data.length === 0) {
      addText(list, "p", "No projects saved yet.", "muted");
    } else {
      for (const project of data) {
        const card = document.createElement("article");
        card.className = "project";
        addText(card, "h3", project.title);
        addText(card, "p", "Category: " + (project.category || "Other"));
        addText(card, "p", project.description || "No description", "muted");
        addText(card, "p", project.is_visible ? "Publicly visible" : "Hidden");

        const edit = addText(card, "button", "Edit");
        edit.type = "button";
        edit.addEventListener("click", () => editProject(project));

        const del = addText(card, "button", "Delete", "danger");
        del.type = "button";
        del.addEventListener("click", () => deleteProject(project));

        list.appendChild(card);
      }
    }

    message("listStatus", (data || []).length + " project(s) loaded.");
  }

  $("refreshButton").addEventListener("click", loadProjects);

  db.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT" || !session) showLogin();
  });

  (async function start() {
    if (
      SUPABASE_URL === "PASTE_YOUR_PROJECT_URL_HERE" ||
      !SUPABASE_URL.startsWith("https://")
    ) {
      showLogin("Setup needed: add your Supabase Project URL in the code.");
      return;
    }

    if (await checkOwner()) await loadProjects();
  })();
</script>
</body>
</html>
