
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aryan Recut Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c1020;color:#f5f6ff;font:15px Arial,sans-serif}
main{max-width:900px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:26px}h2{font-size:19px}
.panel{background:#171e32;border:1px solid #303a55;border-radius:14px;padding:18px;margin:18px 0}
input,textarea,select{width:100%;padding:12px;margin:6px 0 14px;background:#0c1325;color:white;border:1px solid #39435e;border-radius:8px}
textarea{min-height:75px}
label{color:#c4cbe0;font-size:13px}
button{padding:10px 14px;border:0;border-radius:8px;background:#8170ff;color:white;cursor:pointer;margin:3px}
.secondary{background:#35415d}.danger{background:#9e3048}.green{background:#176b50}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.project{padding:13px;margin:12px 0;background:#10172a;border:1px solid #303a55;border-radius:10px;overflow-wrap:anywhere}
.project img{max-width:180px;width:100%;border-radius:7px;display:block;margin-bottom:10px}
small,.muted{color:#aab5ce}
.hidden{display:none!important}
#message{white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:600px){.row{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>
<main>
<header>
  <div>
    <h1>ARYAN RECUT</h1>
    <p class="muted">Simple portfolio admin</p>
  </div>
  <button id="logout" class="secondary hidden">Log out</button>
</header>

<section id="loginBox" class="panel">
  <h2>Admin Login</h2>
  <form id="loginForm">
    <label>Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="loginButton">Login</button>
  </form>
</section>

<div id="app" class="hidden">
  <p id="message" class="muted"></p>

  <section class="panel">
    <h2>My Links and Handles</h2>
    <p class="muted">These links are saved in this browser. Public-site syncing needs a matching settings table and public-page connection.</p>
    <label>Email</label>
    <input id="linkEmail" type="email" placeholder="your@email.com">
    <label>YouTube link</label>
    <input id="linkYoutube" type="url" placeholder="https://youtube.com/@yourhandle">
    <label>Telegram link</label>
    <input id="linkTelegram" type="url" placeholder="https://t.me/yourhandle">
    <label>Instagram link (optional)</label>
    <input id="linkInstagram" type="url" placeholder="https://instagram.com/yourhandle">
    <label>Other link (optional)</label>
    <input id="linkOther" type="url" placeholder="https://example.com">
    <button id="saveLinks">Save links</button>
  </section>

  <section class="panel">
    <h2 id="formTitle">Add Project</h2>
    <form id="projectForm">
      <input id="editId" type="hidden">
      <label>Project title (required)</label>
      <input id="title" maxlength="150" placeholder="Project name" required>

      <div class="row">
        <div>
          <label>Category (optional)</label>
          <select id="category">
            <option value="">Choose category</option>
            <option>Shorts</option>
            <option>Gaming</option>
            <option>Documentary</option>
            <option>Reels</option>
            <option>Motion Graphics</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label>Thumbnail URL (optional)</label>
          <input id="thumbnail" type="url" placeholder="https://...">
        </div>
      </div>

      <label>Video URL (optional)</label>
      <input id="video" type="url" placeholder="https://youtube.com/...">

      <label>Project / portfolio URL (optional)</label>
      <input id="projectUrl" type="url" placeholder="https://...">

      <label>Description (optional)</label>
      <textarea id="description" placeholder="Short description"></textarea>

      <label><input id="visible" type="checkbox" checked style="width:auto;margin:0 6px 0 0">Show publicly</label>
      <p>
        <button id="saveProject">Save Project</button>
        <button type="button" id="cancelEdit" class="secondary hidden">Cancel Edit</button>
      </p>
    </form>
  </section>

  <section class="panel">
    <h2>My Projects</h2>
    <button id="refresh" class="secondary">Refresh</button>
    <div id="projects"></div>
  </section>
</div>
</main>

<script>
"use strict";

const SUPABASE_URL = "https://slitrpyfecoffbagzchp.supabase.co";
const SUPABASE_KEY = "sb_publishable_wFItCw-_qhiDEVFo93RBBQ_2uwwNrb7";
const OWNER_UID = "c9ddb0f1-c832-4ace-a0fc-528be1490bbb";
const TABLE = "projects";

const $ = id => document.getElementById(id);
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let user = null;
let busy = false;

function message(text, error=false) {
  $("message").textContent = text;
  $("message").style.color = error ? "#ff8c9b" : "#78e5b9";
}

function showApp(value) {
  $("app").classList.toggle("hidden", !value);
  $("loginBox").classList.toggle("hidden", value);
  $("logout").classList.toggle("hidden", !value);
}

function checkUrl(value) {
  value = value.trim();
  if (!value) return null;
  let url;
  try { url = new URL(value); }
  catch { throw new Error("Please enter a complete URL, such as https://youtube.com/@handle"); }
  if (!["https:", "http:"].includes(url.protocol))
    throw new Error("Use a URL starting with http:// or https://");
  return url.href;
}

function setBusy(value) {
  busy = value;
  $("loginButton").disabled = value;
  $("saveProject").disabled = value;
  $("saveLinks").disabled = value;
}

async function loadProjects() {
  if (!user) return;
  $("projects").textContent = "Loading...";
  const {data,error} = await client.from(TABLE).select("*");
  if (error) {
    $("projects").textContent = "Error: " + error.message;
    return;
  }
  $("projects").replaceChildren();
  if (!data.length) {
    $("projects").textContent = "No projects yet.";
    return;
  }

  data.forEach(p => {
    const card = document.createElement("div");
    card.className = "project";

    if (p.thumbnail_url) {
      const img = document.createElement("img");
      img.src = p.thumbnail_url;
      img.alt = p.title || "Thumbnail";
      img.onerror = () => img.remove();
      card.append(img);
    }

    const title = document.createElement("h3");
    title.textContent = p.title || "Untitled";
    const info = document.createElement("p");
    info.textContent = (p.category || "No category") + " · " +
      (p.is_visible ? "Public" : "Hidden");
    const desc = document.createElement("p");
    desc.textContent = p.description || "";
    card.append(title, info, desc);

    if (p.video_url) {
      const a = document.createElement("a");
      a.href = p.video_url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "Open video";
      card.append(a);
    }

    const edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.onclick = () => {
      $("editId").value = p.id;
      $("title").value = p.title || "";
      $("category").value = p.category || "";
      $("thumbnail").value = p.thumbnail_url || "";
      $("video").value = p.video_url || "";
      $("projectUrl").value = p.project_url || "";
      $("description").value = p.description || "";
      $("visible").checked = !!p.is_visible;
      $("formTitle").textContent = "Edit Project";
      $("saveProject").textContent = "Update Project";
      $("cancelEdit").classList.remove("hidden");
      window.scrollTo({top:0,behavior:"smooth"});
    };

    const toggle = document.createElement("button");
    toggle.className = "green";
    toggle.textContent = p.is_visible ? "Hide" : "Publish";
    toggle.onclick = async () => {
      const {error} = await client.from(TABLE)
        .update({is_visible: !p.is_visible}).eq("id",p.id);
      if (error) message(error.message,true);
      else { message("Visibility updated."); await loadProjects(); }
    };

    const del = document.createElement("button");
    del.className = "danger";
    del.textContent = "Delete";
    del.onclick = async () => {
      if (!confirm("Delete this project permanently?")) return;
      const {error} = await client.from(TABLE).delete().eq("id",p.id);
      if (error) message(error.message,true);
      else { message("Project deleted."); await loadProjects(); }
    };

    card.append(edit,toggle,del);
    $("projects").append(card);
  });
}

function resetForm() {
  $("projectForm").reset();
  $("editId").value = "";
  $("formTitle").textContent = "Add Project";
  $("saveProject").textContent = "Save Project";
  $("cancelEdit").classList.add("hidden");
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (busy) return;
  setBusy(true);
  try {
    const {data,error} = await client.auth.signInWithPassword({
      email:$("email").value.trim(),
      password:$("password").value
    });
    if (error) throw error;
    if (data.user.id !== OWNER_UID) {
      await client.auth.signOut();
      throw new Error("This account is not the portfolio owner.");
    }
    user = data.user;
    showApp(true);
    await loadProjects();
  } catch(err) {
    alert("Login error: " + err.message);
  } finally { setBusy(false); }
});

$("projectForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!user || busy) return;
  setBusy(true);
  try {
    const title = $("title").value.trim();
    if (!title) throw new Error("Please enter a project title.");

    const record = {
      title,
      category: $("category").value || null,
      thumbnail_url: checkUrl($("thumbnail").value),
      video_url: checkUrl($("video").value),
      description: $("description").value.trim() || null,
      is_visible: $("visible").checked
    };

    const projectUrl = checkUrl($("projectUrl").value);
    // Add project_url only if that column exists in your Supabase table.
    // If your table has no project_url column, leave this line commented.
    record.project_url = projectUrl;

    const id = $("editId").value;
    let result;
    if (id) {
      result = await client.from(TABLE).update(record).eq("id",id);
    } else {
      // Compatible with UUID or text ID columns.
      record.id = crypto.randomUUID();
      result = await client.from(TABLE).insert(record);
    }
    if (result.error) throw result.error;

    resetForm();
    message("Project saved!");
    await loadProjects();
  } catch(err) {
    message("Save error: " + err.message, true);
  } finally { setBusy(false); }
});

$("cancelEdit").onclick = resetForm;
$("refresh").onclick = loadProjects;

$("logout").onclick = async () => {
  await client.auth.signOut();
  user = null;
  showApp(false);
};

const linkFields = ["Email","Youtube","Telegram","Instagram","Other"];
$("saveLinks").onclick = () => {
  const links = {};
  linkFields.forEach(name => {
    const id = "link" + name;
    const value = $(id).value.trim();
    if (name === "Email") {
      links.email = value;
    } else {
      try { links[name.toLowerCase()] = checkUrl(value) || ""; }
      catch(err) { throw err; }
    }
  });
  localStorage.setItem("aryanRecutLinks", JSON.stringify(links));
  message("Links saved in this browser. Public site syncing still needs setup.");
};

try {
  const saved = JSON.parse(localStorage.getItem("aryanRecutLinks") || "{}");
  $("linkEmail").value = saved.email || "bishtaryan333@gmail.com";
  $("linkYoutube").value = saved.youtube || "https://youtube.com/@editflow_112";
  $("linkTelegram").value = saved.telegram || "https://t.me/Aryan13841754";
  $("linkInstagram").value = saved.instagram || "";
  $("linkOther").value = saved.other || "";
} catch {}

client.auth.getSession().then(async ({data,error}) => {
  if (error) { message(error.message,true); return; }
  const existing = data.session?.user;
  if (existing && existing.id === OWNER_UID) {
    user = existing;
    showApp(true);
    await loadProjects();
  } else {
    if (existing) await client.auth.signOut();
    showApp(false);
  }
});
</script>
</body>
</html>
